name: Feature request
description: 提一个功能建议
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先说明**想解决的问题**，再描述期望的方案。方案可以留白，问题必须具体。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 现在用起来哪里不顺手，或者缺了哪个信息
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你期望的方案
      description: 如果有具体想法，写在这里；没有也可以
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代办法
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 Issue，没有重复
          required: true
